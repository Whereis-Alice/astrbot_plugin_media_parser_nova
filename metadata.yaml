name: astrbot_plugin_media_parser_nova
display_name: "Nova 流媒体解析"
short_desc: Nova 流媒体解析 - 多平台媒体、卡片、翻译与热评解析
desc: |
  # Nova 流媒体解析

  自动解析 B站、抖音、快手、微博、小红书、闲鱼、今日头条、小黑盒、Twitter/X、Pixiv、YouTube 等平台链接，转换为媒体直链发送。

  ## 特色

  - 卡片渲染：8 套皮肤 × 深浅配色 × 4 种布局共 64 种版式，皮肤可跟随平台，页签条与操作栏等界面家具按平台换件，自动多图编排和可配置署名
  - 卡片模式统一控制卡片与文本的发送关系
  - 标题、正文和热评可选翻译；热评可只显示在卡片中
  - Twitter/X 热评与互动统计可通过自建 Nitter 实例获取；小黑盒 BBS 热评按平台能力获取
  - 小红书移动端无水印处理
  - B站 Cookie 高画质解析与管理员协助登录
  - YouTube 多层降级解析：Innertube 多客户端取流，被机器人门禁挡下时仍补齐标题/作者/时长/播放量并出完整信息卡片；Cookie 自动跟进服务端轮换并落盘，导出一次即长期免维护，失效时私聊提醒
  - 媒体中转、消息聚合和 ZIP 导出
