desc: |
  # Nova 流媒体解析

  自动解析 B站、抖音、快手、微博、小红书、闲鱼、今日头条、小黑盒、Twitter/X、Pixiv 等平台链接，转换为媒体直链发送。

  ## 特色

  - 卡片渲染：四种原生布局、三套独立高级皮肤和可配置署名
  - 小红书移动端无水印处理
  - B站 Cookie 高画质解析与管理员协助登录
  - 媒体中转、消息聚合、卡片内翻译、热评和 ZIP 导出
